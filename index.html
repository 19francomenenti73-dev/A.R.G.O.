<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1">
<title>A.R.G.O. | Nowcasting Italia</title>
<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;
 font-family:Arial,sans-serif;background:#edf2f5}
#map{position:absolute;inset:0}
.header{
 position:absolute;top:9px;left:50%;
 transform:translateX(-50%);z-index:1000;
 background:rgba(12,30,49,.95);color:#fff;
 border:1px solid #55718b;border-radius:12px;
 padding:7px 12px;display:flex;align-items:center;
 gap:9px;box-shadow:0 3px 14px #0004;
 max-width:calc(100% - 20px)
}
.logo{width:34px;height:34px;flex-shrink:0}
.logo circle.ring{
 fill:none;stroke:#47c8f2;stroke-width:2;
 stroke-dasharray:7 5;transform-origin:center;
 animation:spin 9s linear infinite
}
.logo path{stroke:#9ce9ff;stroke-width:2;fill:none}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{font-weight:800;letter-spacing:2px;font-size:18px}
.sub{font-size:9px;color:#afc5d5;letter-spacing:.5px}
.panel{
 position:absolute;z-index:1000;
 background:rgba(12,30,49,.94);color:#edf7ff;
 border:1px solid #526b81;border-radius:9px;
 padding:9px;font-size:11px
}
#info{top:78px;left:10px;max-width:235px}
#controls{
 top:78px;right:10px;display:flex;
 flex-direction:column;gap:6px
}
#credits{
 position:absolute;bottom:4px;left:50%;
 transform:translateX(-50%);z-index:1000;
 background:#12283de6;color:#c6d8e5;
 padding:4px 9px;border-radius:6px;
 font-size:9px;white-space:nowrap
}
button{
 border:1px solid #6889a5;background:#244761;
 color:#fff;border-radius:6px;padding:7px;
 font-size:11px;cursor:pointer
}
button.off{opacity:.45}
#status{color:#9ce9ff;margin-top:6px}
#scanTime{font-weight:bold;margin-top:5px}
.cell-number{
 background:#12283d;border:1.5px solid white;
 border-radius:11px;color:white;font-size:10px;
 font-weight:bold;padding:2px 5px;
 width:max-content;white-space:nowrap;
 box-shadow:0 1px 5px #0008
}
.leaflet-popup-content{font-size:12px}
@media(max-width:600px){
 .header{top:6px;padding:5px 9px}
 .brand{font-size:15px}
 .sub{font-size:8px}
 #info{top:62px;left:5px;max-width:175px;
  padding:7px;font-size:10px}
 #controls{top:62px;right:5px;padding:6px}
 button{font-size:10px;padding:6px}
 #credits{font-size:8px}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="header">
 <svg class="logo" viewBox="0 0 40 40">
  <circle class="ring" cx="20" cy="20" r="16"/>
  <circle cx="20" cy="20" r="5" fill="#47c8f2"/>
  <path d="M20 4V13M20 27V36M4 20H13M27 20H36"/>
 </svg>
 <div>
  <div class="brand">A.R.G.O.</div>
  <div class="sub">TRACKER RADAR OSSERVATIVO 2D</div>
 </div>
</div>

<div class="panel" id="info">
 <strong>Nowcasting Italia</strong>
 <div id="scanTime">Scansione: —</div>
 <div id="status">Caricamento radar...</div>
</div>

<div class="panel" id="controls">
 <button id="radar">Radar ON</button>
 <button id="centroids">Centroidi ON</button>
 <button id="observed">Tracce ON</button>
 <button id="reload">Aggiorna</button>
</div>

<div id="credits">Weather data by RainViewer</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const DATA_URL="data/argo.json";
const HISTORY_URL="data/argo_history.json";

const map=L.map("map",{
 center:[42.5,12.5],
 zoom:6,
 zoomControl:false,
 preferCanvas:true
});

L.control.zoom({
 position:"bottomright"
}).addTo(map);

// Leaflet + OpenStreetMap. Nessun CARTO.
L.tileLayer(
 "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  attribution:
   '&copy; <a href="https://www.openstreetmap.org/copyright">'+
   'OpenStreetMap contributors</a>',
  maxZoom:19,
  tileSize:256
 }
).addTo(map);

const radarLayer=L.layerGroup().addTo(map);
const centroidLayer=L.layerGroup().addTo(map);
const observedLayer=L.layerGroup().addTo(map);

let radarOn=true;
let centroidsOn=true;
let observedOn=true;
let payload=null;
let history=null;

const pos=p=>[Number(p.lat),Number(p.lon)];
const valid=p=>p&&
 Number.isFinite(Number(p.lat))&&
 Number.isFinite(Number(p.lon))&&
 Math.abs(Number(p.lat))<=90&&
 Math.abs(Number(p.lon))<=180;

const fmt=(v,n=1)=>Number(v).toFixed(n);
const number=id=>String(id||"—").replace(/^ARGO-/,"");

function km(a,b){
 const r=Math.PI/180;
 const p1=a.lat*r,p2=b.lat*r;
 const dp=(b.lat-a.lat)*r;
 const dl=(b.lon-a.lon)*r;
 const h=Math.sin(dp/2)**2+
  Math.cos(p1)*Math.cos(p2)*
  Math.sin(dl/2)**2;
 return 12742*Math.asin(Math.sqrt(Math.min(1,h)));
}

function bearing(a,b){
 const r=Math.PI/180;
 const p1=a.lat*r,p2=b.lat*r;
 const dl=(b.lon-a.lon)*r;
 const y=Math.sin(dl)*Math.cos(p2);
 const x=Math.cos(p1)*Math.sin(p2)-
  Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
 return (Math.atan2(y,x)/r+360)%360;
}

function radarTiles(){
 radarLayer.clearLayers();
 if(!radarOn||!payload?.radar_tiles)return;

 const s=payload.radar_tiles;
 if(typeof s.host!=="string"||
    typeof s.path!=="string"||
    !s.host.startsWith("https://")||
    !s.path.startsWith("/v2/radar/"))return;

 L.tileLayer(
  s.host+s.path+
  "/256/{z}/{x}/{y}/"+
  s.color+"/"+s.options+".png",
  {
   opacity:.76,
   maxNativeZoom:s.zoom_max||7,
   maxZoom:19,
   tileSize:256,
   attribution:
    '<a href="https://www.rainviewer.com/">'+
    'Weather data by RainViewer</a>'
  }
 ).addTo(radarLayer);
}

function drawCentroids(){
 centroidLayer.clearLayers();
 if(!centroidsOn||!payload?.cells)return;

 const showNumbers=map.getZoom()>=8;

 for(const cell of payload.cells){
  if(!valid(cell))continue;

  const id=String(cell.id||"—");
  const marker=L.circleMarker(pos(cell),{
   radius:7,
   color:"#fff",
   weight:2,
   fillColor:cell.motion?"#12a7d8":"#597c9c",
   fillOpacity:.95
  }).addTo(centroidLayer);

  let html="<strong>A.R.G.O. · "+id+"</strong>";
  html+="<div>Lat: "+fmt(cell.lat,4)+
   " · Lon: "+fmt(cell.lon,4)+"</div>";
  html+="<div>Area: "+cell.area_px+" pixel</div>";

  if(cell.motion){
   html+="<div>Velocità osservata: "+
    fmt(cell.motion.speed_kmh)+" km/h</div>";
   html+="<div>Direzione: "+
    fmt(cell.motion.direction_deg,0)+"°</div>";
   html+="<div>Intervallo: "+
    fmt(cell.motion.interval_min,0)+" min</div>";
  }else{
   html+="<div>Vettore non disponibile</div>";
  }

  html+="<small>Tracking radar sperimentale</small>";
  marker.bindPopup(html);
  marker.bindTooltip(id);

  if(showNumbers){
   L.marker(pos(cell),{
    interactive:false,
    icon:L.divIcon({
     className:"",
     html:'<div class="cell-number">'+
      number(id)+'</div>',
     iconSize:[60,22],
     iconAnchor:[-12,11]
    })
   }).addTo(centroidLayer);
  }
 }
}

function arrowHead(a,b){
 const p1=map.latLngToLayerPoint(pos(a));
 const p2=map.latLngToLayerPoint(pos(b));
 const dx=p2.x-p1.x;
 const dy=p2.y-p1.y;
 const length=Math.hypot(dx,dy);

 if(length<8)return;

 const ux=dx/length;
 const uy=dy/length;
 const size=Math.min(12,Math.max(7,length*.22));

 const left=L.point(
  p2.x-ux*size-uy*size*.55,
  p2.y-uy*size+ux*size*.55
 );
 const right=L.point(
  p2.x-ux*size+uy*size*.55,
  p2.y-uy*size-ux*size*.55
 );

 L.polyline([
  map.layerPointToLatLng(left),
  pos(b),
  map.layerPointToLatLng(right)
 ],{
  color:"#087fb5",
  weight:3,
  opacity:.95,
  interactive:false
 }).addTo(observedLayer);
}

function drawObserved(){
 observedLayer.clearLayers();
 if(!observedOn||!history?.tracks)return;

 const now=Date.parse(payload?.timestamp||"");
 const cutoff=now-6*3600000;

 for(const [id,track] of Object.entries(history.tracks)){
  const obs=track.observations||[];
  if(!obs.length)continue;

  // Ogni punto rappresenta una scansione osservata.
  for(let i=0;i<obs.length;i++){
   const p=obs[i];
   if(!valid(p)||Date.parse(p.timestamp)<cutoff)continue;

   L.circleMarker(pos(p),{
    radius:i===obs.length-1?5:3.5,
    color:"#fff",
    weight:1.5,
    fillColor:"#04a6dc",
    fillOpacity:1
   }).bindTooltip(
    id+" · T"+(i+1)+" · "+p.timestamp
   ).addTo(observedLayer);
  }

  // Un segmento soltanto fra osservazioni consecutive.
  for(let i=1;i<obs.length;i++){
   const a=obs[i-1],b=obs[i];
   if(!valid(a)||!valid(b))continue;

   const t0=Date.parse(a.timestamp);
   const t1=Date.parse(b.timestamp);
   const dt=(t1-t0)/60000;

   if(!Number.isFinite(dt)||dt<4||dt>30)continue;
   if(t1<cutoff)continue;

   const distance=km(a,b);
   const speed=distance*60/dt;

   if(distance<.5||speed>130)continue;

   const line=L.polyline(
    [pos(a),pos(b)],{
     color:"#087fb5",
     weight:4,
     opacity:.95,
     lineCap:"round"
    }
   ).addTo(observedLayer);

   line.bindPopup(
    "<strong>"+id+" · segmento "+i+"</strong>"+
    "<div>Distanza: "+fmt(distance)+" km</div>"+
    "<div>Velocità: "+fmt(speed)+" km/h</div>"+
    "<div>Direzione: "+
    fmt(bearing(a,b),0)+"°</div>"+
    "<div>Intervallo: "+fmt(dt,0)+" min</div>"+
    "<small>Movimento osservato sperimentale</small>"
   );

   arrowHead(a,b);
  }
 }
}

function render(){
 radarTiles();
 drawObserved();
 drawCentroids();
}

async function getJSON(path){
 const response=await fetch(
  path+"?v="+Date.now(),
  {cache:"no-store"}
 );
 if(!response.ok){
  throw Error(path+" HTTP "+response.status);
 }
 return response.json();
}

async function load(){
 const status=document.getElementById("status");
 status.textContent="Sincronizzazione...";

 try{
  const next=await getJSON(DATA_URL);
  if(!Array.isArray(next.cells)){
   throw Error("Formato JSON non valido");
  }

  let nextHistory=null;
  try{
   nextHistory=await getJSON(HISTORY_URL);
  }catch(error){
   console.warn("Storico non disponibile",error);
  }

  payload=next;
  history=nextHistory;
  render();

  document.getElementById("scanTime").textContent=
   "Scansione: "+
   new Date(next.timestamp).toLocaleString(
    "it-IT",{timeZone:"UTC"}
   )+" UTC";

  status.textContent=
   next.cells.length+" centroidi · "+
   (next.observed_vectors||0)+
   " vettori osservati";

 }catch(error){
  status.textContent=
   "Dati non disponibili: "+error.message;
  console.error(error);
 }
}

function toggle(id,on,yes,no){
 const button=document.getElementById(id);
 button.textContent=on?yes:no;
 button.classList.toggle("off",!on);
 render();
}

document.getElementById("radar").onclick=()=>{
 radarOn=!radarOn;
 toggle("radar",radarOn,"Radar ON","Radar OFF");
};

document.getElementById("centroids").onclick=()=>{
 centroidsOn=!centroidsOn;
 toggle(
  "centroids",centroidsOn,
  "Centroidi ON","Centroidi OFF"
 );
};

document.getElementById("observed").onclick=()=>{
 observedOn=!observedOn;
 toggle(
  "observed",observedOn,
  "Tracce ON","Tracce OFF"
 );
};

document.getElementById("reload").onclick=load;

map.on("zoomend",()=>{
 drawObserved();
 drawCentroids();
});

load();
setInterval(load,300000);
</script>
</body>
</html>
