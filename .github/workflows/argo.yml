
name: ARGO Radar Observational Tracking

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/argo.yml"
      - "requirements.txt"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: argo-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile backend/argo_pipeline.py

      - name: Run ARGO
        run: python backend/argo_pipeline.py

      - name: Publish observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/argo.json
          git add data/argo_history.json
          git add data/argo_quality.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "ARGO: update observed radar tracking"
          git push
          
