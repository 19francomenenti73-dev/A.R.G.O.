<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>A.R.G.O. | Nowcasting Italia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#edf2f5}
#map{position:absolute;inset:0}
.header{position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(12,30,49,.95);color:#fff;border:1px solid #55718b;border-radius:12px;padding:7px 12px;display:flex;align-items:center;gap:9px;box-shadow:0 3px 14px #0004;max-width:calc(100% - 20px)}
.logo{width:34px;height:34px;flex-shrink:0}
.logo circle.ring{fill:none;stroke:#47c8f2;stroke-width:2;stroke-dasharray:7 5;transform-origin:center;animation:spin 9s linear infinite}
.logo path{stroke:#9ce9ff;stroke-width:2;fill:none}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{font-weight:800;letter-spacing:2px;font-size:18px}
.sub{font-size:9px;color:#afc5d5;letter-spacing:.5px}
.panel{position:absolute;z-index:1000;background:rgba(12,30,49,.94);color:#edf7ff;border:1px solid #526b81;border-radius:9px;padding:9px;font-size:11px}
#info{top:78px;left:10px;max-width:235px}
#controls{top:78px;right:10px;display:flex;flex-direction:column;gap:6px}
#credits{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);z-index:1000;background:#12283de6;color:#c6d8e5;padding:4px 9px;border-radius:6px;font-size:9px;white-space:nowrap}
button{border:1px solid #6889a5;background:#244761;color:#fff;border-radius:6px;padding:7px;font-size:11px;cursor:pointer}
button.off{opacity:.45}
#status{color:#9ce9ff;margin-top:6px}
#scanTime{font-weight:bold;margin-top:5px}
.popup-title{font-weight:bold;margin-bottom:6px}
.popup-line{margin:4px 0}
.popup-note{font-size:10px;color:#637b8a;margin-top:8px}
.leaflet-popup-content{font-size:12px}
.cell-number{background:#12283d;border:1.5px solid #fff;border-radius:11px;color:white;font-size:10px;font-weight:bold;min-width:23px;height:22px;text-align:center;line-height:19px;box-shadow:0 1px 5px #0009}
@media(max-width:600px){.header{top:6px;padding:5px 9px}.brand{font-size:15px}.sub{font-size:8px}#info{top:62px;left:5px;max-width:175px;padding:7px;font-size:10px}#controls{top:62px;right:5px;padding:6px}button{font-size:10px;padding:6px}#credits{font-size:8px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="header">
 <svg class="logo" viewBox="0 0 40 40"><circle class="ring" cx="20" cy="20" r="16"/><circle cx="20" cy="20" r="5" fill="#47c8f2"/><path d="M20 4V13M20 27V36M4 20H13M27 20H36"/></svg>
 <div><div class="brand">A.R.G.O.</div><div class="sub">TRACKER RADAR OSSERVATIVO 2D</div></div>
</div>
<div class="panel" id="info"><strong>Nowcasting Italia</strong><div id="scanTime">Scansione: —</div><div id="status">Caricamento radar...</div></div>
<div class="panel" id="controls"><button id="radar">Radar ON</button><button id="centroids">Centroidi ON</button><button id="observed">Tracce ON</button><button id="reload">Aggiorna</button></div>
<div id="credits">Weather data by RainViewer</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const DATA_URL="data/argo.json";
const HISTORY_URL="data/argo_history.json";
const map=L.map("map",{center:[42.5,12.5],zoom:6,zoomControl:false,preferCanvas:true});
L.control.zoom({position:"bottomright"}).addTo(map);
// Leaflet + OpenStreetMap. Nessun CARTO.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
 attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
 maxZoom:19,tileSize:256
}).addTo(map);
const radarLayer=L.layerGroup().addTo(map);
const centroidLayer=L.layerGroup().addTo(map);
const observedLayer=L.layerGroup().addTo(map);
let radarOn=true,centroidsOn=true,observedOn=true,payload=null,history=null;
const pos=p=>[Number(p.lat),Number(p.lon)];
const valid=p=>p&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon))&&Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180;
const fmt=(v,n=1)=>Number(v).toFixed(n);
const number=id=>String(id||"—").replace(/^ARGO-/,"");
function km(a,b){
 const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dp=(b.lat-a.lat)*r,dl=(b.lon-a.lon)*r;
 const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return 12742*Math.asin(Math.sqrt(Math.min(1,h)));
}
function bearing(a,b){
 const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lon-a.lon)*r;
 const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
 return (Math.atan2(y,x)/r+360)%360;
}
// Destinazione geodetica usata SOLO per il prolungamento grafico tratteggiato.
function destination(p,angle,dist){
 const r=Math.PI/180,d=dist/6371,a=angle*r,p1=p.lat*r,l1=p.lon*r;
 const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(a));
 const l2=l1+Math.atan2(Math.sin(a)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));
 return [p2/r,l2/r];
}
function radarTiles(){
 radarLayer.clearLayers();
 if(!radarOn||!payload?.radar_tiles)return;
 const s=payload.radar_tiles;
 if(typeof s.host!=="string"||typeof s.path!=="string"||!s.host.startsWith("https://")||!s.path.startsWith("/v2/radar/"))return;
 L.tileLayer(s.host+s.path+"/256/{z}/{x}/{y}/"+s.color+"/"+s.options+".png",{
  opacity:.76,maxNativeZoom:s.zoom_max||7,maxZoom:19,tileSize:256,
  attribution:'<a href="https://www.rainviewer.com/">Weather data by RainViewer</a>'
 }).addTo(radarLayer);
}
function drawCentroids(){
 centroidLayer.clearLayers();
 if(!centroidsOn||!payload?.cells)return;
 for(const cell of payload.cells){
  if(!valid(cell))continue;
  const id=String(cell.id||"—");
  const marker=L.circleMarker(pos(cell),{
   radius:7,color:"#fff",weight:2,fillColor:cell.motion?"#12a7d8":"#597c9c",fillOpacity:.95
  }).addTo(centroidLayer);
  // Numero permanente visibile senza coprire il punto centrale.
  L.marker(pos(cell),{interactive:false,icon:L.divIcon({
   className:"",html:'<div class="cell-number">'+number(id)+'</div>',
   iconSize:[44,22],iconAnchor:[-9,10]
  })}).addTo(centroidLayer);
  let html='<div class="popup-title">A.R.G.O. · '+id+'</div>'+
   '<div class="popup-line">Lat: '+fmt(cell.lat,4)+' · Lon: '+fmt(cell.lon,4)+'</div>'+
   '<div class="popup-line">Area: '+cell.area_px+' pixel</div>'+
   '<div class="popup-line">Indice cromatico: '+fmt(cell.intensity_index,3)+'</div>';
  if(cell.motion){
   html+='<div class="popup-line">Velocità osservata: '+fmt(cell.motion.speed_kmh)+' km/h</div>'+
    '<div class="popup-line">Direzione: '+fmt(cell.motion.direction_deg,0)+'°</div>'+
    '<div class="popup-line">Intervallo: '+fmt(cell.motion.interval_min,0)+' min</div>';
  }else html+='<div class="popup-line">Vettore non disponibile</div>';
  html+='<div class="popup-note">Centroide da radar 2D; tracking sperimentale.</div>';
  marker.bindPopup(html);
 }
}
function drawObserved(){
 observedLayer.clearLayers();
 if(!observedOn||!history?.tracks)return;
 for(const [id,track] of Object.entries(history.tracks)){
  const obs=track.observations||[];
  for(let i=0;i<obs.length;i++){
   const p=obs[i];
   if(!valid(p))continue;
   L.circleMarker(pos(p),{
    radius:i===obs.length-1?5:4,color:"#fff",weight:1.5,
    fillColor:"#04a6dc",fillOpacity:1
   }).bindTooltip(id+" · osservazione "+(i+1)).addTo(observedLayer);
  }
  for(let i=1;i<obs.length;i++){
   const a=obs[i-1],b=obs[i];
   if(!valid(a)||!valid(b))continue;
   const dt=(Date.parse(b.timestamp)-Date.parse(a.timestamp))/60000;
   if(!(dt>=4&&dt<=30))continue;
   const distance=km(a,b),speed=distance*60/dt;
   if(speed>130||distance<.05)continue;
   const dir=bearing(a,b);
   const line=L.polyline([pos(a),pos(b)],{
    color:"#087fb5",weight:5,opacity:.95,lineCap:"round"
   }).addTo(observedLayer);
   line.bindPopup('<strong>'+id+' · segmento '+i+'</strong><div>Osservato: '+fmt(distance)+' km</div><div>Velocità: '+fmt(speed)+' km/h</div><div>Direzione: '+fmt(dir,0)+'°</div><div>Intervallo: '+fmt(dt,0)+' min</div>');
   // Punta sul punto realmente osservato: non modifica il segmento.
   const arrowLen=Math.min(2.5,Math.max(.35,distance*.30));
   const left=destination(b,(dir+155)%360,arrowLen);
   const right=destination(b,(dir+205)%360,arrowLen);
   L.polyline([left,pos(b),right],{color:"#087fb5",weight:4,opacity:.95,interactive:false}).addTo(observedLayer);
   // Solo ultimo segmento: estensione VISIVA, non osservazione.
   if(i===obs.length-1){
    const extra=Math.min(8,Math.max(1,distance*.55));
    L.polyline([pos(b),destination(b,dir,extra)],{
     color:"#f4a940",weight:3,opacity:.9,dashArray:"6 7"
    }).bindPopup('Prolungamento grafico, NON movimento osservato').addTo(observedLayer);
   }
  }
 }
}
function render(){radarTiles();drawObserved();drawCentroids();}
async function getJSON(path){
 const r=await fetch(path+"?v="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw Error(path+" HTTP "+r.status);
 return r.json();
}
async function load(){
 const status=document.getElementById("status");
 status.textContent="Sincronizzazione...";
 try{
  const next=await getJSON(DATA_URL);
  if(!Array.isArray(next.cells))throw Error("Formato JSON non valido");
  let h=null;
  try{h=await getJSON(HISTORY_URL);}catch(e){console.warn("Storico non disponibile",e);}
  payload=next;history=h;render();
  document.getElementById("scanTime").textContent="Scansione: "+new Date(next.timestamp).toLocaleString("it-IT",{timeZone:"UTC"})+" UTC";
  status.textContent=next.cells.length+" centroidi · "+(next.observed_vectors||0)+" vettori osservati";
 }catch(e){status.textContent="Dati non disponibili: "+e.message;console.error(e);}
}
function toggle(id,on,yes,no){
 const b=document.getElementById(id);b.textContent=on?yes:no;b.classList.toggle("off",!on);render();
}
document.getElementById("radar").onclick=()=>{radarOn=!radarOn;toggle("radar",radarOn,"Radar ON","Radar OFF");};
document.getElementById("centroids").onclick=()=>{centroidsOn=!centroidsOn;toggle("centroids",centroidsOn,"Centroidi ON","Centroidi OFF");};
document.getElementById("observed").onclick=()=>{observedOn=!observedOn;toggle("observed",observedOn,"Tracce ON","Tracce OFF");};
document.getElementById("reload").onclick=load;
load();setInterval(load,300000);
</script>
</body>
</html>
